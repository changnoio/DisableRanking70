document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rmal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f88f2023-92a5-42ba-8951-f42c890e9734\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #05070F; }\n  body { -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #7DD3FC; text-decoration: none; }\n  a:hover { color: #BAE6FD; }\n  ::selection { background: rgba(99,102,241,.4); }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; }\n  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n  @keyframes sheen { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:\n  radial-gradient(1100px 620px at 12% -6%, rgba(99,102,241,.30), transparent 62%),\n  radial-gradient(900px 560px at 92% 4%, rgba(236,72,153,.18), transparent 60%),\n  radial-gradient(1200px 700px at 50% 110%, rgba(16,185,129,.14), transparent 62%),\n  #05070F;color:#E9EDF8;font-family:'IBM Plex Sans Thai','Anuphan',system-ui,sans-serif;font-size:18px;line-height:1.55;padding-bottom:72px\">\n\n  <div style=\"position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(5,7,15,.72);border-bottom:1px solid rgba(255,255,255,.09)\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n      <div style=\"width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,#7DD3FC,#6366F1 55%,#EC4899);box-shadow:0 10px 30px rgba(99,102,241,.45);flex:none\"><\u002Fdiv>\n      <div style=\"flex:1;min-width:200px\">\n        <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.2px;line-height:1.2\">ผลการจัดกลุ่มศักยภาพชนิดกีฬา ของสมาคมกีฬาแห่งประเทศไทย (คนพิการ)<\u002Fdiv>\n        <div style=\"font-size:14px;color:#8E9BB7\">กองทุนพัฒนาการกีฬาแห่งชาติ · แผนงานที่ 2 · นักกีฬาคนพิการ<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"padding:9px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font-size:15px;font-weight:600;white-space:nowrap\">ปีงบประมาณ {{ fiscalYear }}<\u002Fdiv>\n        <sc-if value=\"{{ notOverview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ goHome }}\" style=\"padding:9px 18px;border-radius:99px;border:1px solid rgba(125,211,252,.35);background:linear-gradient(120deg,rgba(99,102,241,.30),rgba(125,211,252,.18));font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"border-color:rgba(125,211,252,.7)\">← ภาพรวม<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1400px;margin:0 auto;padding:0 20px\">\n\n    <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation:riseIn .5s ease both\">\n        <div style=\"padding:52px 0 34px\">\n          <div style=\"display:inline-block;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:14px;letter-spacing:.4px;color:#A9B6D3;margin-bottom:18px\">ผลการประเมินโดยเจ้าหน้าที่กองทุนฯ<\u002Fdiv>\n          <h1 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(34px,6.2vw,62px);line-height:1.12;margin:0 0 16px;letter-spacing:-1px;background:linear-gradient(100deg,#FFFFFF 8%,#BFD3FF 45%,#F9A8D4 92%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:pretty\">ภาพรวมศักยภาพรายชนิดกีฬา<br>ของสมาคมกีฬาแห่งประเทศไทย (คนพิการ)<\u002Fh1>\n          <p style=\"margin:0;max-width:760px;font-size:clamp(17px,2.2vw,20px);color:#A9B6D3;text-wrap:pretty\">สรุปคะแนน 4 มิติ (Pride · Future · Wealth · Health) รวม 100 คะแนน <br>ในการจัดกลุ่มศักยภาพรายชนิดกีฬาของแต่ละสมาคมกีฬา (คนพิการ)<br>เพื่อกำหนดเพดานงบประมาณสนับสนุนรายชนิดกีฬา<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:16px;margin-bottom:30px\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"padding:24px 22px;border-radius:22px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))\">\n              <div style=\"font-size:15px;color:#93A1BF;font-weight:500;margin-bottom:6px\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(34px,5vw,46px);line-height:1.05;{{ k.tint }}\">{{ k.value }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#7F8DAC;margin-top:6px\">{{ k.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;margin-bottom:44px\">\n          <div style=\"padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))\">\n            <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:21px;margin-bottom:6px\">การกระจายตัวของระดับศักยภาพ<\u002Fdiv>\n            <div style=\"font-size:14px;color:#8E9BB7;margin-bottom:20px\">นับเฉพาะชนิดกีฬาที่ประเมินแล้ว<\u002Fdiv>\n            <div style=\"display:flex;height:16px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);gap:3px;margin-bottom:22px\">\n              <sc-for list=\"{{ levelBars }}\" as=\"lv\" hint-placeholder-count div style=\"height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden\">\n                    <div style=\"height:100%;border-radius:99px;{{ d.bar }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap\">\n          <h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,32px);margin:0\">สมาคมกีฬา<\u002Fh2>\n          <div style=\"font-size:16px;color:#8E9BB7\">เลือกสมาคมเพื่อดูรายชนิดกีฬา<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:18px;margin-bottom:46px\">\n          <sc-for list=\"{{ assocCards }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ a.open }}\" style=\"cursor:pointer;padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease\" style-hover=\"transform:translateY(-4px);border-color:rgba(255,255,255,.24);box-shadow:0 22px 50px rgba(0,0,0,.45)\">\n              <div style=\"display:flex;gap:14px;align-items:flex-start;margin-bottom:18px\">\n                <div style=\"width:52px;height:52px;border-radius:16px;flex:none;{{ a.chipBg }}\"><\u002Fdiv>\n                <div style=\"flex:1\">\n                  <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:20px;line-height:1.25;text-wrap:pretty\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font-size:15px;color:#8E9BB7;margin-top:4px\">{{ a.sportCount }} ชนิดกีฬา · ประเมินแล้ว {{ a.assessedCount }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px\">\n                <div style=\"flex:1;min-width:120px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05)\">\n                  <div style=\"font-size:13px;color:#93A1BF\">คะแนนเฉลี่ย<\u002Fdiv>\n                  <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:30px;line-height:1.15\">{{ a.avgText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:120px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05)\">\n                  <div style=\"font-size:13px;color:#93A1BF\">เพดานงบรวม<\u002Fdiv>\n                  <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:30px;line-height:1.15\">{{ a.budgetText }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:10px\">\n                <div style=\"height:100%;border-radius:99px;{{ a.progress }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:14px;color:#8E9BB7\">\n                <span>ความคืบหน้าการประเมิน {{ a.progressText }}<\u002Fspan>\n                <span style=\"font-weight:600;color:#BFD3FF\">ดูรายละเอียด →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap\">\n          <h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,32px);margin:0\">ชนิดกีฬาที่ประเมินแล้ว<\u002Fh2>\n          <div style=\"font-size:16px;color:#8E9BB7\">เรียงตามคะแนนรวมสูงสุด<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:12px\">\n          <sc-for list=\"{{ ranked }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ s.open }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,.02));transition:border-color .18s ease,transform .18s ease\" style-hover=\"border-color:rgba(255,255,255,.24);transform:translateX(4px)\">\n              <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:20px;color:#6D7B99;width:34px\">{{ s.rank }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:180px\">\n                <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:22px\">{{ s.sport }}<\u002Fdiv>\n                <div style=\"font-size:14px;color:#8E9BB7\">{{ s.assoc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:7px 16px;border-radius:99px;font-size:15px;font-weight:600;{{ s.levelChip }}\">{{ s.levelLabel }}<\u002Fdiv>\n              <div style=\"text-align:right;min-width:110px\">\n                <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:30px;line-height:1\">{{ s.scoreText }}<span style=\"font-size:16px;color:#8E9BB7\"> / 100<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:14px;color:#8E9BB7\">เพดาน {{ s.budgetText }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAssoc }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:riseIn .4s ease both\">\n        <div style=\"padding:40px 0 28px\">\n          <div style=\"font-size:15px;color:#8E9BB7;margin-bottom:10px\">สมาคมกีฬาแห่งประเทศไทย · นักกีฬาคนพิการ<\u002Fdiv>\n          <h1 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(30px,5.4vw,52px);line-height:1.15;margin:0 0 20px;letter-spacing:-.6px;text-wrap:pretty\">{{ aName }}<\u002Fh1>\n          <div style=\"display:grid;grid-template-columns:repe >\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:260px\">\n            <div style=\"font-size:15px;color:#8E9BB7;margin-bottom:6px\">{{ sNameEn }}<\u002Fdiv>\n            <h1 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(32px,5.6vw,54px);line-height:1.1;margin:0 0 14px;letter-spacing:-.6px\">{{ sName }}<\u002Fh1>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px\">\n              <div style=\"padding:9px 20px;border-radius:99px;font-size:17px;font-weight:700;{{ sLevelChip }}\">{{ sLevelLabel }}<\u002Fdiv>\n              <div style=\"padding:9px 20px;border-radius:99px;font-size:17px;font-weight:600;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)\">เพดานงบ {{ sBudgetText }}<\u002Fdiv>\n              <div style=\"padding:9px 20px;border-radius:99px;font-size:17px;font-weight:600;{{ sDocChip }}\">เอกสาร: {{ sDocStatus }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:17px;color:#B9C6E2;text-wrap:pretty;max-width:760px\">{{ sFinalStatus }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:16px;margin-bottom:26px\">\n          <sc-for list=\"{{ sDims }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"padding:24px;border-radius:22px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))\">\n              <div style=\"font-size:14px;letter-spacing:.6px;font-weight:600;{{ d.tint }}\">{{ d.name }}<\u002Fdiv>\n              <div style=\"font-size:16px;color:#A9B6D3;margin-bottom:12px\">{{ d.th }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:12px\">\n                <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:42px;line-height:1\">{{ d.value }}<\u002Fdiv>\n                <div style=\"font-size:17px;color:#8E9BB7\">/ {{ d.max }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden\">\n                <div style=\"height:100%;border-radius:99px;{{ d.bar }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));margin-bottom:26px\">\n          <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:22px;margin-bottom:12px\">บทวิเคราะห์ของเจ้าหน้าที่<\u002Fdiv>\n          <div style=\"font-size:18px;color:#C7D3EC;text-wrap:pretty\">{{ sAnalysis }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-bottom:34px\">\n          <div style=\"padding:24px;border-radius:22px;border:1px solid rgba(110,231,168,.25);background:linear-gradient(160deg,rgba(16,185,129,.14),rgba(255,255,255,.02))\">\n            <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:19px;margin-bottom:14px;color:#8FF0C0\">เอกสารที่พบ<\u002Fdiv>\n            <div style=\"display:grid;gap:10px\">\n              <sc-for list=\"{{ sDocsFound }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:16px;color:#D5E5F5;display:flex;gap:10px\"><span style=\"color:#6EE7A8\">✓<\u002Fspan><span>{{ d.text }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sNoDocsFound }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:16px;color:#9FB0CC\">ไม่พบรายการเอกสารแนบในระบบ<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:24px;border-radius:22px;border:1px solid rgba(253,164,175,.25);background:linear-gradient(160deg,rgba(244,63,94,.14),rgba(255,255,255,.02))\">\n            <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:19px;margin-bottom:14px;color:#FFC2CB\">เอกสารที่ยังขาด<\u002Fdiv>\n            <div style=\"display:grid;gap:10px\">\n              <sc-for list=\"{{ sDocsMissing }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:16px;color:#D5E5F5;display:flex;gap:10px\"><span style=\"color:#FDA4AF\">!<\u002Fspan><span>{{ d.text }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sNoDocsMissing }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:16px;color:#9FB0CC\">ไม่มีรายการเอกสารที่ขาด — สมาคมส่งเอกสารครบตามเกณฑ์<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:24px;border-radius:22px;border:1px solid rgba(255,196,107,.25);background:linear-gradient(160deg,rgba(245,158,11,.14),rgba(255,255,255,.02))\">\n            <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:19px;margin-bottom:14px;color:#FFD79A\">ตัวชี้วัดที่ต้องการเอกสารเพิ่ม<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ sPending }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <div style=\"padding:6px 14px;border-radius:10px;background:rgba(245,158,11,.18);border:1px solid rgba(255,196,107,.3);font-size:16px;font-weight:600;color:#FFD79A\">{{ p.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sNoPending }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:16px;color:#9FB0CC\">ไม่มีตัวชี้วัดที่รอเอกสารเพิ่มเติม<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,32px);margin:0 0 18px\">รายละเอียดคะแนนรายตัวชี้วัด<\u002Fh2>\n        <div style=\"display:grid;gap:20px\">\n          <sc-for list=\"{{ sGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"border-radius:24px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));overflow:hidden\">\n              <div style=\"padding:20px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;{{ g.headBg }}\">\n                <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:21px\">{{ g.th }}<\u002Fdiv>\n                <div style=\"font-size:15px;color:#A9B6D3\">{{ g.name }}<\u002Fdiv>\n                <div style=\"margin-left:auto;font-family:'Anuphan',sans-serif;font-weight:700;font-size:22px\">{{ g.value }} <span style=\"font-size:15px;color:#A9B6D3\">/ {{ g.max }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;gap:2px;background:rgba(255,255,255,.05)\">\n                <sc-for list=\"{{ g.indicators }}\" as=\"i\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:22px 24px;background:#0A0E1A\">\n                    <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n                      <div style=\"padding:5px 12px;border-radius:9px;background:rgba(255,255,255,.08);font-family:'Anuphan',sans-serif;font-weight:700;font-size:16px;flex:none\">{{ i.id }}<\u002Fdiv>\n                      <div style=\"flex:1;min-width:180px;font-size:19px;font-weight:600;text-wrap:pretty\">{{ i.name }}<\u002Fdiv>\n                      <div style=\"padding:5px 14px;border-radius:99px;font-size:14px;font-weight:600;{{ i.statusChip }}\">{{ i.status }}<\u002Fdiv>\n                      <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:24px;min-width:86px;text-align:right\">{{ i.scoreText }} <span style=\"font-size:15px;color:#8E9BB7\">/ {{ i.max }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:16px\">\n                      <div style=\"height:100%;border-radius:99px;{{ i.bar }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ i.hasSubs }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"display:grid;gap:10px;margin-bottom:16px\">\n                        <sc-for list=\"{{ i.subs }}\" as=\"sub\" hint-placeholder-count=\"3\">\n                          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.04)\">\n                            <div style=\"font-size:15px;color:#8E9BB7;font-weight:600;width:52px;flex:none\">{{ sub.id }}<\u002Fdiv>\n                            <div style=\"flex:1;min-width:150px;font-size:16px\">{{ sub.name }}<\u002Fdiv>\n                            <div style=\"font-size:15px;color:#93A1BF\">{{ sub.detail }}<\u002Fdiv>\n                            <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:18px;min-width:70px;text-align:right;{{ sub.tint }}\">{{ sub.scoreText }} <span style=\"font-size:14px;color:#8E9BB7\">/ {{ sub.max }}<\u002Fspan><\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"padding:16px 18px;border-radius:14px;background:rgba(125,211,252,.07);border-left:3px solid rgba(125,211,252,.5)\">\n                      <div style=\"font-size:14px;color:#8FC6F0;font-weight:600;margin-bottom:4px\">เหตุผลของเจ้าหน้าที่<\u002Fdiv>\n                      <div style=\"font-size:16px;color:#C7D3EC;text-wrap:pretty\">{{ i.reasoning }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ i.hasEvidence }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px\">\n                        <sc-for list=\"{{ i.evidence }}\" as=\"e\" hint-placeholder-count=\"1\">\n                          <div style=\"padding:6px 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:15px;color:#A9B6D3\">📎 {{ e.text }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:30px;padding:24px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:15px;color:#8E9BB7;display:grid;gap:6px\">\n          <div>ประเมินโดย: {{ sEvaluatedBy }}<\u002Fdiv>\n          <div>สถานะการประเมิน: {{ sStage }}<\u002Fdiv>\n          <div>ข้อมูล ณ วันที่: {{ sDate }} · แหล่งข้อมูล: {{ sSources }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEmptySport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin:60px 0;padding:48px 32px;border-radius:26px;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.03);text-align:center\">\n        <div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:clamp(26px,4.4vw,40px);margin-bottom:12px\">{{ eName }}<\u002Fdiv>\n        <div style=\"font-size:18px;color:#A9B6D3;max-width:560px;margin:0 auto 26px;text-wrap:pretty\">ยังไม่มีผลการประเมินสำหรับชนิดกีฬานี้ อยู่ระหว่างรอเอกสารและข้อมูลประกอบการประเมินจากสมาคม<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goAssoc }}\" style=\"display:inline-block;padding:12px 26px;border-radius:99px;border:1px solid rgba(125,211,252,.4);background:rgba(99,102,241,.22);font-size:16px;font-weight:600;cursor:pointer\">← กลับไปหน้าสมาคม<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;fiscalYear&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2570&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showPending&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;การแสดงผล&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'overview', assocId: null, sportName: null, data: null };\n\n  componentDidMount() {\n    import((window.__resources && window.__resources.assessmentData) || './data.js').then(m => this.setState({ data: m })).catch(e => console.error('load data', e));\n  }\n\n  key(a, s) { return a + '||' + s; }\n\n  // คะแนนรวมคำนวณจากคะแนนรายตัวชี้วัดเสมอ (ป้องกันผลรวมในไฟล์ต้นทางคลาดเคลื่อน)\n  calc(rec) {\n    if (!rec) return { dims: {}, total: 0 };\n    if (rec.__calc) return rec.__calc;\n    const dims = {};\n    rec.indicator_scores.forEach(i => {\n      dims[i.dimension_id] = (dims[i.dimension_id] || 0) + (i.assessed_score || 0);\n    });\n    const total = Object.keys(dims).reduce((s, k) => s + dims[k], 0);\n    rec.__calc = { dims, total: Math.round(total * 100) / 100 };\n    return rec.__calc;\n  }\n\n  dimScore(rec, dimId) { return this.calc(rec).dims[dimId] || 0; }\n  totalScore(rec) { return this.calc(rec).total; }\n\n  num(n) {\n    if (n === null || n === undefined) return '—';\n    return (Math.round(n * 10) / 10).toString();\n  }\n\n  levelFor(score, LEVELS) {\n    if (score === null || score === undefined) return null;\n    return LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[LEVELS.length - 1];\n  }\n\n  budgetText(b) { return (b / 1000000) + ' ล้านบาท'; }\n\n  chip(c1, c2) {\n    return 'background:linear-gradient(120deg,' + c1 + '33,' + c2 + '22);border:1px solid ' + c1 + '66;color:' + c1 + ';';\n  }\n\n  grad(c1, c2) { return 'background:linear-gradient(90deg,' + c1 + ',' + c2 + ');'; }\n\n  ring(pct, c1, c2) {\n    const p = Math.max(0, Math.min(100, pct));\n    return 'background:conic-gradient(from -90deg,' + c1 + ' 0%,' + c2 + ' ' + p + '%,rgba(255,255,255,.08) ' + p + '%);';\n  }\n\n  go(view, assocId, sportName) {\n    this.setState({ view, assocId, sportName });\n    if (typeof window !== 'undefined') window.scrollTo(0, 0);\n  }\n\n  renderVals() {\n    const base = {\n      fiscalYear: this.props.fiscalYear || '2570',\n      isOverview: true, isAssoc: false, isSport: false, isEmptySport: false, notOverview: false,\n      kpis: [], levels: [], levelBars: [], dimAvg: [], assocCards: [], ranked: [],\n      aName: '', aStats: [], aSports: [], aSportCountText: '',\n      sName: '', sNameEn: '', sAssocName: '', sScoreText: '—', sRing: '', sScoreTint: '',\n      sLevelLabel: '', sLevelChip: '', sBudgetText: '', sDocStatus: '', sDocChip: '',\n      sFinalStatus: '', sAnalysis: '', sDims: [], sDocsFound: [], sDocsMissing: [], sPending: [],\n      sGroups: [], sEvaluatedBy: '', sStage: '', sDate: '', sSources: '', eName: '',\n      sNoDocsMissing: false, sNoPending: false, sNoDocsFound: false,\n      goHome: () => this.go('overview', null, null),\n      goAssoc: () => this.go('assoc', this.state.assocId, null)\n    };\n    const d = this.state.data;\n    if (!d) return base;\n\n    const { ROSTER, ASSESSMENTS, DIMENSIONS, LEVELS } = d;\n    const index = {};\n    ASSESSMENTS.forEach(a => {\n      const r = ROSTER.find(x => x.id === a.assoc_id) ||\n        ROSTER.find(x => x.name === a.association_name) ||\n        ROSTER.find(x => a.association_name && a.association_name.indexOf(x.short) >= 0);\n      const sport = a.roster_sport || a.sport_name_th;\n      if (r) index[this.key(r.name, sport)] = a;\n    });\n    const dimMap = {};\n    DIMENSIONS.forEach(x => { dimMap[x.id] = x; });\n    const showPending = this.props.showPending !== false;\n\n    const assocData = ROSTER.map(r => {\n      const items = r.sports.map(name => ({ name, rec: index[this.key(r.name, name)] || null }));\n      const done = items.filter(i => i.rec);\n      const scores = done.map(i => this.totalScore(i.rec));\n      const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;\n      const budget = done.reduce((sum, i) => {\n        const lv = this.levelFor(this.totalScore(i.rec), LEVELS);\n        return sum + (lv ? lv.budget : 0);\n      }, 0);\n      return { r, items, done, avg, budget };\n    });\n\n    const allDone = assocData.reduce((acc, a) => acc.concat(a.done.map(i => ({ i, a }))), []);\n    const totalSports = ROSTER.reduce((s, r) => s + r.sports.length, 0);\n    const avgAll = allDone.length ? allDone.reduce((s, x) => s + this.totalScore(x.i.rec), 0) / allDone.length : null;\n    const budgetAll = assocData.reduce((s, a) => s + a.budget, 0);\n\n    base.notOverview = this.state.view !== 'overview';\n    base.isOverview = this.state.view === 'overview';\n\n    base.kpis = [\n      { label: 'สมาคมกีฬา (คนพิการ)', value: ROSTER.length, note: 'สมาคมกีฬาแห่งประเทศไทย (คนพิการ)', tint: '' },\n      { label: 'ชนิดกีฬาทั้งหมด', value: totalSports, note: 'ภายใต้การกำกับ 6 สมาคม', tint: '' },\n      { label: 'ประเมินแล้ว', value: allDone.length, note: 'มีผลคะแนนครบถ้วน', tint: 'color:#6EE7A8' },\n      { label: 'รอข้อมูล', value: totalSports - allDone.length, note: 'ยังไม่ได้รับเอกสารประเมิน', tint: 'color:#FFC46B' },\n      { label: 'คะแนนเฉลี่ย', value: this.num(avgAll), note: 'จากคะแนนเต็ม 100', tint: '' },\n      { label: 'เพดานงบรวม', value: (budgetAll / 1000000) + ' ล.', note: 'ตามระดับศักยภาพที่ประเมินแล้ว', tint: 'color:#7DD3FC' }\n    ];\n\n    const lvCounts = LEVELS.map(l => ({\n      l, count: allDone.filter(x => this.levelFor(this.totalScore(x.i.rec), LEVELS).key === l.key).length\n    }));\n    base.levels = lvCounts.map(x => ({\n      label: x.l.label, count: x.count, budgetText: this.budgetText(x.l.budget),\n      dot: this.grad(x.l.c1, x.l.c2)\n    }));\n    base.levelBars = lvCounts.filter(x => x.count > 0).map(x => ({\n      bar: 'flex:' + x.count + ';' + this.grad(x.l.c1, x.l.c2)\n    }));\n\n    base.dimAvg = DIMENSIONS.map(dim => {\n      const vals = allDone.map(x => {\n        return this.dimScore(x.i.rec, dim.id);\n      });\n      const av = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;\n      return {\n        th: dim.th, name: dim.name, max: dim.max, value: this.num(av),\n        bar: 'width:' + (av / dim.max * 100) + '%;' + this.grad(dim.c1, dim.c2)\n      };\n    });\n\n    base.assocCards = assocData.map(a => ({\n      name: a.r.name,\n      sportCount: a.r.sports.length,\n      assessedCount: a.done.length,\n      avgText: this.num(a.avg),\n      budgetText: a.budget ? (a.budget / 1000000) + ' ล.' : '—',\n      chipBg: 'background:linear-gradient(140deg,' + a.r.c1 + ',' + a.r.c2 + ');box-shadow:0 10px 26px ' + a.r.c2 + '55;',\n      progress: 'width:' + (a.done.length / a.r.sports.length * 100) + '%;' + this.grad(a.r.c1, a.r.c2),\n      progressText: a.done.length + '/' + a.r.sports.length,\n      open: () => this.go('assoc', a.r.id, null)\n    }));\n\n    base.ranked = allDone\n      .slice()\n      .sort((x, y) => this.totalScore(y.i.rec) - this.totalScore(x.i.rec))\n      .map((x, n) => {\n        const sc = this.totalScore(x.i.rec);\n        const lv = this.levelFor(sc, LEVELS);\n        return {\n          rank: (n + 1) + '.', sport: x.i.name, assoc: x.a.r.name,\n          scoreText: this.num(sc), levelLabel: lv.label, levelChip: this.chip(lv.c1, lv.c2),\n          budgetText: this.budgetText(lv.budget),\n          open: () => this.go('sport', x.a.r.id, x.i.name)\n        };\n      });\n\n    const cur = assocData.find(a => a.r.id === this.state.assocId);\n\n    if (this.state.view === 'assoc' && cur) {\n      base.isAssoc = true;\n      base.aName = cur.r.name;\n      base.aSportCountText = 'ทั้งหมด ' + cur.r.sports.length + ' ชนิดกีฬา · ประเมินแล้ว ' + cur.done.length;\n      base.aStats = [\n        { label: 'ชนิดกีฬาทั้งหมด', value: cur.r.sports.length, tint: '' },\n        { label: 'ประเมินแล้ว', value: cur.done.length, tint: 'color:#6EE7A8' },\n        { label: 'คะแนนเฉลี่ย', value: this.num(cur.avg), tint: '' },\n        { label: 'เพดานงบรวม', value: cur.budget ? (cur.budget / 1000000) + ' ล.' : '—', tint: 'color:#7DD3FC' }\n      ];\n      base.aSports = cur.items.filter(it => showPending || it.rec).map(it => {\n        const rec = it.rec;\n        const sc = rec ? this.totalScore(rec) : null;\n        const lv = this.levelFor(sc, LEVELS);\n        return {\n          name: it.name,\n          sub: rec ? (rec.sport_name_en || 'ประเมินแล้ว') : 'ยังไม่มีข้อมูลประเมิน',\n          scoreText: rec ? this.num(sc) : '—',\n          scoreTint: rec ? 'color:#FFFFFF' : 'color:#5B688A',\n          ring: rec ? this.ring(sc, lv.c1, lv.c2) : 'background:conic-gradient(rgba(255,255,255,.08) 0 100%);',\n          levelLabel: rec ? lv.label : 'รอข้อมูล',\n          levelChip: rec ? this.chip(lv.c1, lv.c2) : 'background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#8E9BB7;',\n          cardBg: rec ? 'cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));' : 'cursor:pointer;background:rgba(255,255,255,.022);',\n          cta: rec ? 'ดูรายละเอียด →' : 'รอเอกสาร',\n          open: () => this.go('sport', cur.r.id, it.name)\n        };\n      });\n    }\n\n    if (this.state.view === 'sport' && cur) {\n      const rec = index[this.key(cur.r.name, this.state.sportName)];\n      if (!rec) {\n        base.isEmptySport = true;\n        base.eName = this.state.sportName || '';\n      } else {\n        base.isSport = true;\n        const sc = this.totalScore(rec);\n        const lv = this.levelFor(sc, LEVELS);\n        base.sName = rec.sport_name_th;\n        base.sNameEn = rec.sport_name_en || '';\n        base.sAssocName = cur.r.name;\n        base.sScoreText = this.num(sc);\n        base.sScoreTint = 'color:' + lv.c1;\n        base.sRing = this.ring(sc, lv.c1, lv.c2);\n        base.sLevelLabel = lv.label;\n        base.sLevelChip = this.chip(lv.c1, lv.c2);\n        base.sBudgetText = this.budgetText(lv.budget);\n        const docStatus = rec.document_submission.status || 'ไม่ระบุ';\n        base.sDocStatus = docStatus;\n        base.sDocChip = docStatus === 'ครบถ้วน' ? this.chip('#6EE7A8', '#10B981')\n          : docStatus === 'ไม่ระบุ' ? 'background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#9FB0CC;'\n          : this.chip('#FFC46B', '#F59E0B');\n        base.sFinalStatus = rec.overall_result.final_status;\n        base.sAnalysis = rec.overall_result.analysis_summary;\n        base.sDims = DIMENSIONS.map(dim => {\n          const v = this.dimScore(rec, dim.id);\n          return {\n            name: dim.name, th: dim.th, max: dim.max, value: this.num(v),\n            tint: 'color:' + dim.c1,\n            bar: 'width:' + (v / dim.max * 100) + '%;' + this.grad(dim.c1, dim.c2)\n          };\n        });\n        base.sDocsFound = (rec.document_submission.documents_found || []).map(t => ({ text: t }));\n        base.sDocsMissing = (rec.document_submission.documents_missing || []).map(t => ({ text: t }));\n        const pend = {};\n        (rec.document_submission.indicators_without_evidence || []).forEach(x => { pend[x] = 1; });\n        (rec.document_submission.indicators_requiring_additional_documents || []).forEach(x => { pend[x] = 1; });\n        base.sPending = Object.keys(pend).map(t => ({ text: t }));\n        base.sNoDocsFound = base.sDocsFound.length === 0;\n        base.sNoDocsMissing = base.sDocsMissing.length === 0;\n        base.sNoPending = base.sPending.length === 0;\n\n        const statusChip = st => {\n          if (st === 'ประเมินแล้ว') return this.chip('#6EE7A8', '#10B981');\n          if (st === 'รอข้อมูล') return this.chip('#FFC46B', '#F59E0B');\n          return this.chip('#7DD3FC', '#3B82F6');\n        };\n\n        base.sGroups = DIMENSIONS.map(dim => {\n          return {\n            th: dim.th, name: dim.name, max: dim.max, value: this.num(this.dimScore(rec, dim.id)),\n            headBg: 'background:linear-gradient(100deg,' + dim.c1 + '26,' + dim.c2 + '10);border-bottom:1px solid rgba(255,255,255,.08);',\n            indicators: rec.indicator_scores.filter(i => i.dimension_id === dim.id).map(i => {\n              const subs = (i.sub_indicators || []).map(s => ({\n                id: s.sub_indicator_id, name: s.sub_indicator_name, max: s.max_score,\n                detail: s.detail || (s.assessed_score === null ? 'ไม่มีหลักฐาน' : ''),\n                scoreText: this.num(s.assessed_score),\n                tint: s.assessed_score === null ? 'color:#6D7B99' : 'color:' + dim.c1\n              }));\n              return {\n                id: i.indicator_id, name: i.indicator_name, max: i.max_score,\n                scoreText: this.num(i.assessed_score),\n                status: i.score_status,\n                statusChip: statusChip(i.score_status),\n                bar: 'width:' + ((i.assessed_score || 0) / i.max_score * 100) + '%;' + this.grad(dim.c1, dim.c2),\n                hasSubs: subs.length > 0,\n                subs,\n                reasoning: i.officer_reasoning,\n                hasEvidence: (i.evidence_items || []).length > 0,\n                evidence: (i.evidence_items || []).map(t => ({ text: t }))\n              };\n            })\n          };\n        });\n\n        base.sEvaluatedBy = rec.meta.evaluated_by;\n        base.sStage = rec.meta.assessment_stage;\n        base.sDate = rec.meta.evaluation_date;\n        base.sSources = (rec.meta.data_sources || []).join(', ');\n      }\n    }\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
